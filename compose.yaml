services:
  bot:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    init: true
    read_only: true
    user: "1000:1000"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 1g
    stop_grace_period: 150s
    volumes:
      - ./config.json:/app/config.json:ro
      - ./secrets:/run/secrets:ro
      - state:/data
      - actual-cache:/data/actual
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m,uid=1000,gid=1000,mode=0700
volumes:
  state:
  actual-cache:
